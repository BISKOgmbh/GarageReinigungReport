<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BISKO · Garage Reinigung</title>
<!--
================= EINRICHTUNG (einmalig) =================
 1) LOGO: Lege deine Logo-Datei (z. B. logo.png) in denselben Ordner
    wie diese Datei. Siehe unten den <img> mit dem Kommentar "LOGO HIER".
 2) E-MAIL-VERSAND: Auf https://web3forms.com mit info@bisko-frankfurt.de
    einen kostenlosen Access Key holen (kein Server, keine Datenbank)
    und unten bei CONFIG.web3formsKey eintragen.
 3) Datei auf die Homepage hochladen. Fertig.
=========================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#F7F5F1; --header:#1C1B1A; --red:#C41E1E; --red-d:#9c1616;
    --ink:#1C1B1A; --soft:#4a463f; --muted:#7A7570; --line:#e2ddd4; --card:#ffffff;
    --green:#2E7D32; --grey:#7A7570;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  /* Google-Übersetzen-Banner unterdrücken, Layout bleibt stabil */
  .goog-te-banner-frame{display:none!important}
  body{top:0!important;position:static!important}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.5;
       -webkit-font-smoothing:antialiased}
  .app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}

  header{background:var(--header);color:#fff;padding:12px 14px calc(10px);position:sticky;top:0;z-index:20}
  .htop{display:flex;align-items:center;gap:10px}
  /* LOGO HIER: 'logo.png' durch deinen Dateinamen ersetzen. Fehlt die Datei, wird nichts angezeigt. */
  .logo{height:34px;width:auto;display:block}
  .htitle{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em;flex:1;line-height:1.1}
  .hbtn{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;
        padding:9px 12px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .hbtn:active{background:rgba(255,255,255,.12)}
  .bar{height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:12px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--red);width:0;transition:width .25s}
  .hmeta{font-size:13px;color:#cfc9bf;margin-top:7px;display:flex;justify-content:space-between}

  #xlate{display:none;background:#fff;color:#000;padding:8px 14px;border-bottom:1px solid var(--line)}
  #xlate .hint{font-size:13px;color:var(--muted);margin-bottom:4px}

  main{flex:1;padding:22px 16px 10px}
  .emoji{font-size:64px;line-height:1;text-align:center;margin:6px 0 10px}
  .welcomelogo{display:block;width:58%;max-width:230px;height:auto;margin:4px auto 14px}
  .picon{text-align:center;margin:2px 0 12px}
  .picon img{width:132px;height:132px;object-fit:contain}
  .jicon{width:30px;height:30px;object-fit:contain;vertical-align:middle}
  .ricon{width:24px;height:24px;object-fit:contain;vertical-align:-6px;margin-right:4px}
  h1{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.15;margin:0 0 8px;text-align:center}
  .lead{color:var(--soft);font-size:18px;margin:0 auto 22px;text-align:center;max-width:30ch}

  label.fld{display:block;font-size:15px;color:var(--muted);font-weight:600;margin:0 0 8px}
  input[type=text],input[type=number],textarea{
    width:100%;border:2px solid var(--line);border-radius:14px;padding:16px;font-size:20px;
    font-family:var(--sans);outline:0;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{border-color:var(--red)}
  textarea{min-height:130px;resize:vertical}
  .withunit{position:relative}
  .withunit .u{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:18px}

  /* Auswahl (nass/trocken) */
  .choices{display:flex;flex-direction:column;gap:14px}
  .choice{display:flex;align-items:center;gap:16px;border:2px solid var(--line);border-radius:16px;padding:20px 18px;
          cursor:pointer;font-size:20px;font-weight:600;background:#fff}
  .choice .big{font-size:30px}
  .choice.sel{border-color:var(--red);background:#fff5f5}

  /* Status-Knöpfe */
  .status{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .sbtn{display:flex;align-items:center;gap:14px;border:2px solid var(--line);background:#fff;border-radius:16px;
        padding:18px;font-size:19px;font-weight:700;cursor:pointer;color:var(--ink);font-family:var(--sans);width:100%;text-align:left}
  .sbtn .ic{font-size:24px}
  .sbtn.green.sel{background:var(--green);border-color:var(--green);color:#fff}
  .sbtn.red.sel{background:var(--red);border-color:var(--red);color:#fff}
  .sbtn.grey.sel{background:var(--grey);border-color:var(--grey);color:#fff}

  /* Stepper */
  .stepper{display:flex;align-items:center;justify-content:center;gap:24px;margin:14px 0 4px}
  .stepper button{width:82px;height:82px;border-radius:50%;border:2px solid var(--line);background:#fff;
    font-size:40px;line-height:1;color:var(--red);cursor:pointer;font-family:var(--sans)}
  .stepper button:active{background:#fff5f5}
  .stepper .val{min-width:92px;text-align:center;font-size:58px;font-weight:700;font-variant-numeric:tabular-nums}
  .zerohint{text-align:center;color:var(--muted);font-size:15px;margin-top:2px}

  /* Fotos */
  .shot{margin-top:8px}
  .shot input{display:none}
  .pbtn{display:flex;justify-content:center;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;
        padding:18px;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;margin:10px 0;background:#fff}
  .pbtn.cam{background:var(--red);border-color:var(--red);color:#fff}
  .pbtn.none{border-color:var(--grey);color:var(--grey)}
  .pbtn.none.selnone{background:var(--grey);border-color:var(--grey);color:#fff}
  .pbtn .ic{font-size:24px}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .thumbs:empty{display:none}
  .thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#eee}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:4px;right:4px;width:30px;height:30px;border:0;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer}
  .pill{display:inline-block;background:#efe9df;color:var(--soft);font-weight:700;font-size:15px;border-radius:99px;padding:5px 14px;margin-top:12px}

  /* Übersicht */
  .review .row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .review .row .k{color:var(--muted);font-size:16px}
  .review .row .v{font-weight:700;text-align:right;font-size:16px}
  .review h3{font-family:var(--serif);font-size:16px;color:var(--red);margin:22px 0 4px;font-weight:600}
  .tag{font-weight:700}
  .tag.green{color:var(--green)} .tag.red{color:var(--red)} .tag.grey{color:var(--grey)}

  footer{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px}
  .nav{flex:1;border-radius:16px;padding:18px;font-size:20px;font-weight:700;cursor:pointer;font-family:var(--sans);
       border:2px solid var(--line);background:#fff;color:var(--ink)}
  .nav.primary{background:var(--red);border-color:var(--red);color:#fff;flex:2}
  .nav.primary:disabled{opacity:.45}
  .nav.ghost{flex:0 0 auto;width:68px;font-size:26px}

  .banner{background:#fdf3e7;border:1px solid #e9c9a0;color:#8a4b0e;border-radius:14px;padding:14px;font-size:16px;margin-bottom:18px}
  .done{text-align:center;padding:36px 12px}
  .done .big{width:92px;height:92px;border-radius:50%;background:#e7f4ec;color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:50px}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .link{color:var(--red);font-weight:700;text-decoration:none;font-size:19px}

  /* Sprungliste */
  #jump{position:fixed;inset:0;z-index:40;background:rgba(28,27,26,.5);display:none}
  #jump .panel{position:absolute;top:0;right:0;height:100%;width:min(360px,88%);background:var(--paper);
    box-shadow:-8px 0 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
  #jump .ph{background:var(--header);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-size:19px}
  #jump .pl{overflow:auto;padding:6px 0}
  #jump .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px}
  #jump .item .e{font-size:24px;width:30px;text-align:center}
  #jump .item .s{margin-left:auto;font-size:13px;font-weight:700}
  #jump .item.cur{background:#fff}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--line);display:inline-block}
  .dot.green{background:var(--green)} .dot.red{background:var(--red)} .dot.grey{background:var(--grey)} .dot.set{background:var(--red)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="htop">
      <!-- LOGO HIER: 'logo.png' in diesen Ordner legen. Fehlt es, wird es ausgeblendet. -->
      <img class="logo" alt="BISKO" onerror="this.style.display='none'">
      <div class="htitle">Garage Reinigung</div>
      <button class="hbtn" id="btnXlate">🌐</button>
      <button class="hbtn" id="btnList">☰ Liste</button>
    </div>
    <div class="bar"><i id="hBar"></i></div>
    <div class="hmeta"><span id="hMeta"></span><span id="hStep"></span></div>
  </header>

  <div id="xlate">
    <div class="hint">Sprache wählen · Choose language · Dil seçin · اختر اللغة · Wybierz język</div>
    <div id="google_translate_element"></div>
    <div id="xlateMsg" style="font-size:13px;color:#7A7570;margin-top:4px"></div>
  </div>

  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<div id="jump"><div class="panel">
  <div class="ph"><span>Punkte</span><button class="hbtn" id="jClose">Schließen</button></div>
  <div class="pl" id="jList"></div>
</div></div>

let idx=0;
const $=(id)=>document.getElementById(id);
const main=$("main"), foot=$("foot");
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;};
const esc=(s)=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const STLABEL={erledigt:"Erledigt",nicht:"Nicht möglich",na:"Nicht zutreffend","":"—"};
const rico=(p)=> p.img?`<img class="ricon" src="${p.img}">`:`${p.emoji||""} `;
const STCLS={erledigt:"green",nicht:"red",na:"grey"};

function camIcon(){return '<span class="ic">📷</span>';}
function galIcon(){return '<span class="ic">🖼️</span>';}

function render(){
  const s=steps[idx];
  $("hStep").textContent=(idx+1)+" / "+steps.length;
  $("hBar").style.width=Math.round(idx/(steps.length-1)*100)+"%";
  $("hMeta").textContent=state.garage||"";
  main.innerHTML=""; foot.innerHTML="";
  main.scrollTop=0; window.scrollTo(0,0);

  if(s.type==="start"){
    main.appendChild(el(`<div>
      <img class="welcomelogo" src="${LOGO_FULL}" alt="BISKO Facility Management GmbH">
      <h1>Willkommen</h1>
      <p class="lead">Bitte deinen Namen eingeben. Dann Schritt für Schritt tippen. Am Ende schicken wir alles an das Büro.</p>
      <label class="fld">Dein Name</label>
      <input id="in-name" type="text" placeholder="Vorname und Nachname" value="${esc(state.mitarbeiter)}" autocomplete="name">
      ${CONFIG.accessCode?`<div style="height:16px"></div><label class="fld">Code</label><input id="in-code" type="text" placeholder="Code eingeben">`:``}
    </div>`));
    footBtns({next:"Los geht's",back:false});
    setTimeout(()=>$("in-name").focus(),60); return;
  }

  let body=`${s.img?`<div class="picon"><img src="${s.img}" alt=""></div>`:`<div class="emoji">${s.emoji||""}</div>`}<h1>${esc(s.title)}</h1>`;
  if(s.lead) body+=`<p class="lead">${esc(s.lead)}</p>`;
  else if(s.hint) body+=`<p class="lead">${esc(s.hint)}</p>`;

  if(s.type==="text"){
    body+=`<input id="in" type="text" placeholder="${esc(s.placeholder||"")}" value="${esc(state[s.field]||"")}">`;
    main.appendChild(el(`<div>${body}</div>`)); setTimeout(()=>$("in").focus(),60);
  }
  else if(s.type==="number"){
    body+=`<div class="withunit"><input id="in" type="number" inputmode="decimal" placeholder="${esc(s.placeholder||"")}" value="${esc(state[s.field]||"")}"><span class="u">${esc(s.unit||"")}</span></div>`;
    main.appendChild(el(`<div>${body}</div>`)); setTimeout(()=>$("in").focus(),60);
  }
  else if(s.type==="choice"){
    body+=`<div class="choices">`+s.options.map(o=>
      `<div class="choice ${state[s.field]===o.v?"sel":""}" data-o="${esc(o.v)}"><span class="big">${o.e}</span><span>${esc(o.t)}</span></div>`).join("")+`</div>`;
    const w=el(`<div>${body}</div>`); main.appendChild(w);
    w.querySelectorAll(".choice").forEach(c=>c.addEventListener("click",()=>{
      state[s.field]=c.getAttribute("data-o");
      w.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel")); c.classList.add("sel");
      updateNext(); setTimeout(advance,180);
    }));
  }
  else if(s.type==="status"){
    const cur=state.status[s.id];
    body+=`<div class="status">
      <button class="sbtn green ${cur==='erledigt'?'sel':''}" data-v="erledigt"><span class="ic">✅</span> Erledigt</button>
      <button class="sbtn red ${cur==='nicht'?'sel':''}" data-v="nicht"><span class="ic">⛔</span> Nicht möglich</button>
      <button class="sbtn grey ${cur==='na'?'sel':''}" data-v="na"><span class="ic">➖</span> Nicht nötig</button>
    </div>`;
    const w=el(`<div>${body}</div>`); main.appendChild(w);
    w.querySelectorAll(".sbtn").forEach(b=>b.addEventListener("click",()=>{
      state.status[s.id]=b.getAttribute("data-v");
      w.querySelectorAll(".sbtn").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
      setTimeout(advance,180);
    }));
  }
  else if(s.type==="auftrag"){
    const a=state.auftrag[s.id];
    body+=`<div class="status">
      <button class="sbtn green ${a==='ja'?'sel':''}" data-v="ja"><span class="ic">✅</span> Ja, beauftragt</button>
      <button class="sbtn red ${a==='nein'?'sel':''}" data-v="nein"><span class="ic">⛔</span> Nein</button>
      <button class="sbtn grey ${a==='unklar'?'sel':''}" data-v="unklar"><span class="ic">❔</span> Nicht klar – Büro fragen</button>
    </div>`;
    if(a==='ja'){
      body+=`<div style="margin-top:18px"><label class="fld">Größe in m²</label>
        <div class="withunit"><input id="in-fl" type="number" inputmode="decimal" placeholder="z. B. 40" value="${esc(state.flaeche[s.id]||'')}"><span class="u">m²</span></div></div>`;
      body+=`<div style="margin-top:14px"><label class="fld">Fotos (Pflicht)</label></div>`+photoHTML(s.id,false);
    }
    const w=el(`<div>${body}</div>`); main.appendChild(w);
    w.querySelectorAll(".sbtn").forEach(b=>b.addEventListener("click",()=>{
      const v=b.getAttribute("data-v"); state.auftrag[s.id]=v;
      if(v!=="ja"){ state.photos[s.id]=[]; state.flaeche[s.id]=""; }
      render();
    }));
    if(a==='ja'){
      const fl=w.querySelector("#in-fl");
      fl.addEventListener("input",()=>{ state.flaeche[s.id]=fl.value.trim(); updateNext(); });
      wirePhotos(w,s.id,state.photos[s.id],false);
    }
  }
  else if(s.type==="meter"){
    const yn=state.meterYN[s.id];
    body+=`<div class="status">
      <button class="sbtn green ${yn==='ja'?'sel':''}" data-v="ja"><span class="ic">✅</span> Ja</button>
      <button class="sbtn red ${yn==='nein'?'sel':''}" data-v="nein"><span class="ic">⛔</span> Nein</button>
    </div>`;
    if(yn==='ja'){
      body+=`<div style="margin-top:18px"><label class="fld">Wie viele Meter?</label>
        <div class="withunit"><input id="in-m" type="number" inputmode="decimal" placeholder="z. B. 25" value="${esc(state.meterVal[s.id]||'')}"><span class="u">${esc(s.unit||'m')}</span></div></div>`;
    }
    const w=el(`<div>${body}</div>`); main.appendChild(w);
    w.querySelectorAll(".sbtn").forEach(b=>b.addEventListener("click",()=>{
      const v=b.getAttribute("data-v"); state.meterYN[s.id]=v; if(v!=="ja") state.meterVal[s.id]=""; render();
    }));
    if(yn==='ja'){ const mi=w.querySelector("#in-m"); mi.addEventListener("input",()=>{ state.meterVal[s.id]=mi.value.trim(); updateNext(); }); setTimeout(()=>mi.focus(),60); }
  }
  else if(s.type==="count"){
    body+=stepperHTML(state.counts[s.id]);
    const w=el(`<div>${body}</div>`); main.appendChild(w);
    wireStepper(w,s.id);
  }
  else if(s.type==="countphoto"){
    body+=stepperHTML(state.counts[s.id])+photoHTML(s.id,s.allowNone);
    const w=el(`<div>${body}</div>`); main.appendChild(w);
    wireStepper(w,s.id); wirePhotos(w,s.id,state.photos[s.id],s.allowNone);
  }
  else if(s.type==="photo"){
    body+=photoHTML(s.id,s.allowNone);
    const w=el(`<div>${body}</div>`); main.appendChild(w);
    wirePhotos(w,s.id,state.photos[s.id],s.allowNone);
  }
  else if(s.type==="textarea"){
    body+=`<textarea id="in" placeholder="Notiz …">${esc(state[s.field]||"")}</textarea>`;
    main.appendChild(el(`<div>${body}</div>`));
  }
  else if(s.type==="review"){ return renderReview(); }

  footBtns({next:"Weiter",back:true});
  updateNext();
}

function stepperHTML(v){
  return `<div class="stepper"><button type="button" id="minus">–</button><div class="val" id="cval">${v}</div><button type="button" id="plus">+</button></div>
    <div class="zerohint">0 = nichts / nicht gemacht</div>`;
}
function wireStepper(w,id){
  const upd=()=>{w.querySelector("#cval").textContent=state.counts[id];};
  w.querySelector("#plus").addEventListener("click",()=>{state.counts[id]++;upd();});
  w.querySelector("#minus").addEventListener("click",()=>{state.counts[id]=Math.max(0,state.counts[id]-1);upd();});
}
function photoHTML(pfx,allowNone){
  return `<div class="shot">
      <label class="pbtn cam">${camIcon()} Foto machen<input type="file" accept="image/*" capture="environment" multiple id="${pfx}-cam"></label>
      <label class="pbtn gal">${galIcon()} Foto aus Galerie<input type="file" accept="image/*" multiple id="${pfx}-gal"></label>
      ${allowNone?`<button type="button" class="pbtn none ${state.keine[pfx]?'selnone':''}" id="${pfx}-none"><span class="ic">➖</span> Keine vorhanden</button>`:``}
      <div class="thumbs" id="${pfx}-thumbs"></div>
      <div style="text-align:center"><span class="pill" id="${pfx}-pc"></span></div>
    </div>`;
}
function wirePhotos(root,pfx,arr,allowNone){
  const noneBtn=allowNone?root.querySelector("#"+pfx+"-none"):null;
  const draw=()=>{
    const thumbs=root.querySelector("#"+pfx+"-thumbs"); thumbs.innerHTML="";
    arr.forEach((p,i)=>{
      const t=el(`<div class="thumb"><img src="${p.url}" alt=""><button type="button">×</button></div>`);
      t.querySelector("button").addEventListener("click",()=>{arr.splice(i,1);draw();});
      thumbs.appendChild(t);
    });
    root.querySelector("#"+pfx+"-pc").textContent=arr.length+" Foto"+(arr.length===1?"":"s");
    updateNext();
  };
  draw();
  const handle=async(e)=>{ for(const f of [...e.target.files]){ if(f.type.startsWith("image/")){ const p=await compress(f); if(p.url) arr.push(p);} }
    e.target.value=""; if(allowNone){ state.keine[pfx]=false; if(noneBtn) noneBtn.classList.remove("selnone"); } draw(); };
  root.querySelector("#"+pfx+"-cam").addEventListener("change",handle);
  root.querySelector("#"+pfx+"-gal").addEventListener("change",handle);
  if(noneBtn) noneBtn.addEventListener("click",()=>{ state.keine[pfx]=!state.keine[pfx]; noneBtn.classList.toggle("selnone",state.keine[pfx]); updateNext(); });
}

function footBtns({next,back}){
  if(back){ const b=el(`<button class="nav ghost">‹</button>`); b.addEventListener("click",()=>{idx--;render();}); foot.appendChild(b); }
  const n=el(`<button class="nav primary">${next}</button>`); n.id="btnNext"; n.addEventListener("click",advance); foot.appendChild(n);
}
function currentValid(){
  const s=steps[idx];
  if(s.type==="start"){ const n=$("in-name"); if(!n||!n.value.trim()) return false;
    if(CONFIG.accessCode){ const c=$("in-code"); if(!c||c.value.trim()!==CONFIG.accessCode) return false;} return true; }
  if(s.required){
    if(s.type==="text"||s.type==="number"){ const i=$("in"); return i&&i.value.trim()!==""; }
    if(s.type==="choice"){ return !!state[s.field]; }
  }
  if((s.type==="photo"||s.type==="countphoto") && s.required){
    if(state.photos[s.id].length>0) return true;
    if(s.allowNone && state.keine[s.id]) return true;
    return false;
  }
  if(s.type==="auftrag"){
    if(!state.auftrag[s.id]) return false;
    if(state.auftrag[s.id]==="ja") return !!(state.flaeche[s.id]&&String(state.flaeche[s.id]).trim()!=="") && state.photos[s.id].length>0;
    return true;
  }
  if(s.type==="meter"){
    if(!state.meterYN[s.id]) return false;
    if(state.meterYN[s.id]==="ja") return !!(state.meterVal[s.id]&&String(state.meterVal[s.id]).trim()!=="");
    return true;
  }
  return true;
}
function updateNext(){ const b=$("btnNext"); if(b) b.disabled=!currentValid(); }
document.addEventListener("input",updateNext);
function stepSatisfied(s){
  if(s.type==="text"||s.type==="number") return !s.required || (state[s.field]&&String(state[s.field]).trim()!=="");
  if(s.type==="choice") return !s.required || !!state[s.field];
  if((s.type==="photo"||s.type==="countphoto")&&s.required) return state.photos[s.id].length>0||(s.allowNone&&state.keine[s.id]);
  if(s.type==="auftrag"){ if(!state.auftrag[s.id]) return false;
    if(state.auftrag[s.id]==="ja") return !!(state.flaeche[s.id]&&String(state.flaeche[s.id]).trim()!=="")&&state.photos[s.id].length>0; return true; }
  if(s.type==="meter"){ if(!state.meterYN[s.id]) return false;
    if(state.meterYN[s.id]==="ja") return !!(state.meterVal[s.id]&&String(state.meterVal[s.id]).trim()!==""); return true; }
  return true;
}

function advance(){
  const s=steps[idx];
  if(!currentValid()){ alert("Bitte ausfüllen."); return; }
  if(s.type==="start") state.mitarbeiter=$("in-name").value.trim();
  else if(s.type==="text"||s.type==="number"||s.type==="textarea") state[s.field]=$("in").value.trim();
  if(idx<steps.length-1){ idx++; render(); }
}

/* ---------- Foto verkleinern ---------- */
function compress(file){
  return new Promise((res)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1280; let w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res({url:cv.toDataURL("image/jpeg",0.55),w,h}); };
    img.onerror=()=>{URL.revokeObjectURL(url);res({url:"",w:0,h:0});};
    img.src=url;
  });
}

function renderReview(){
  const stP=POINTS.filter(p=>p.kind==="status");
  const cP=POINTS.filter(p=>p.kind==="count"||p.kind==="countphoto");
  const phP=POINTS.filter(p=>p.kind==="photo"||p.kind==="countphoto"||(p.kind==="auftrag"&&state.auftrag[p.id]==="ja"));
  let h=`<div class="review"><div class="emoji">📋</div><h1>Prüfen und senden</h1>
    <p class="lead">Kurz anschauen. Dann auf senden tippen.</p>`;
  if(!isKeySet()) h+=`<div class="banner">Der automatische E-Mail-Versand ist noch nicht eingerichtet. Du kannst trotzdem senden: über <b>Teilen</b> oder <b>Herunterladen</b>.</div>`;
  h+=`<dl>
    <div class="row"><span class="k">Name</span><span class="v">${esc(state.mitarbeiter||"—")}</span></div>
    <div class="row"><span class="k">Tiefgarage</span><span class="v">${esc(state.garage||"—")}</span></div>
    <div class="row"><span class="k">Reinigung</span><span class="v">${esc(state.art||"—")}</span></div>
    <div class="row"><span class="k">Fläche</span><span class="v">${state.size?esc(state.size)+" m²":"—"}</span></div></dl>`;
  h+=`<h3>Aufgaben</h3><dl>`+stP.map(p=>{
      const v=state.status[p.id]; const cls=STCLS[v]||"";
      return `<div class="row"><span class="k">${rico(p)}${esc(p.title)}</span><span class="v tag ${cls}">${STLABEL[v]}</span></div>`;
    }).join("")+`</dl>`;
  const cs=cP.filter(p=>state.counts[p.id]>0);
  h+=`<h3>Zählungen</h3>`+ (cs.length? `<dl>`+cs.map(p=>`<div class="row"><span class="k">${rico(p)}${esc(p.title)}</span><span class="v">${state.counts[p.id]}</span></div>`).join("")+`</dl>` : `<p class="lead" style="text-align:left">Nichts gezählt.</p>`);
  const mP=POINTS.filter(p=>p.kind==="meter");
  if(mP.length) h+=`<dl>`+mP.map(p=>{ const yn=state.meterYN[p.id]; const v=yn==="ja"?`${esc(state.meterVal[p.id]||"?")} m`:yn==="nein"?"Nein":"—"; const cls=yn==="ja"?"green":yn==="nein"?"red":"grey"; return `<div class="row"><span class="k">${rico(p)}${esc(p.title)}</span><span class="v tag ${cls}">${v}</span></div>`; }).join("")+`</dl>`;
  const aP=POINTS.filter(p=>p.kind==="auftrag");
  h+=`<h3>Räume – nur wenn beauftragt</h3><dl>`+aP.map(p=>{ const a=state.auftrag[p.id];
      const v=a==="ja"?`Ja · ${esc(state.flaeche[p.id]||"?")} m²`:a==="nein"?"Nein":a==="unklar"?"Büro fragen":"—";
      const cls=a==="ja"?"green":a==="nein"?"red":"grey";
      return `<div class="row"><span class="k">${rico(p)}${esc(p.title)}</span><span class="v tag ${cls}">${v}</span></div>`; }).join("")+`</dl>`;
  h+=`<h3>Fotos</h3><dl>`+phP.map(p=>`<div class="row"><span class="k">${rico(p)}${esc(p.title)}</span><span class="v">${state.photos[p.id].length}</span></div>`).join("")+`</dl>`;
  if(state.bemerkung) h+=`<h3>Notiz</h3><p class="lead" style="text-align:left">${esc(state.bemerkung)}</p>`;
  h+=`</div>`;
  main.appendChild(el(h));
  const b=el(`<button class="nav ghost">‹</button>`); b.addEventListener("click",()=>{idx--;render();}); foot.appendChild(b);
  const n=el(`<button class="nav primary">Senden ✉️</button>`); n.addEventListener("click",submit); foot.appendChild(n);
}

function today(){ return new Date().toLocaleDateString("de-DE"); }
function buildPdf(){

  const W=210,H=297,mx=14; let y=16;
  try{ doc.addImage(LOGO_MARK,"PNG",mx,y-5,13,13); }catch(e){}
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor("#1C1B1A");
  doc.text("Reinigungs-Report Tiefgarage",mx+16,y);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor("#7A7570");
  doc.text("BISKO Facility Management GmbH",W-mx,y,{align:"right"});
  y+=6;doc.setDrawColor("#C41E1E");doc.setLineWidth(0.8);doc.line(mx,y,W-mx,y);y+=8;
  const kv=(k,v)=>{doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor("#7A7570");doc.text(k,mx,y);
    doc.setFont("helvetica","normal");doc.setTextColor("#1C1B1A");doc.text(String(v||"—"),mx+42,y);y+=7;};
  kv("Datum",today()); kv("Mitarbeiter/in",state.mitarbeiter); kv("Tiefgarage",state.garage);
  kv("Art der Reinigung",state.art); kv("Fläche",state.size?state.size+" m²":"—");
  y+=1;doc.setDrawColor("#e2ddd4");doc.setLineWidth(0.3);doc.line(mx,y,W-mx,y);y+=7;

  const head=(t)=>{ if(y>H-24){doc.addPage();y=16;} doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor("#C41E1E");doc.text(t,mx,y);y+=6; };
  head("Aufgaben");
  doc.setFontSize(10);
  POINTS.filter(p=>p.kind==="status").forEach(p=>{ if(y>H-16){doc.addPage();y=16;}
    doc.setFont("helvetica","normal");doc.setTextColor("#1C1B1A");doc.text("• "+p.title,mx,y);
    doc.setFont("helvetica","bold");doc.text(STLABEL[state.status[p.id]],W-mx,y,{align:"right"});y+=6.2; });
  y+=2; head("Zählungen");
  const cs=POINTS.filter(p=>(p.kind==="count"||p.kind==="countphoto")&&state.counts[p.id]>0);
  doc.setFontSize(10);
  if(cs.length) cs.forEach(p=>{ if(y>H-16){doc.addPage();y=16;}
    doc.setFont("helvetica","normal");doc.setTextColor("#1C1B1A");doc.text("• "+p.title,mx,y);
    doc.setFont("helvetica","bold");doc.text(String(state.counts[p.id]),W-mx,y,{align:"right"});y+=6.2; });
  else { doc.setFont("helvetica","italic");doc.setTextColor("#7A7570");doc.text("Nichts gezählt.",mx,y);y+=6.2; }
  POINTS.filter(p=>p.kind==="meter").forEach(p=>{ if(y>H-16){doc.addPage();y=16;} const yn=state.meterYN[p.id];
    const txt=yn==="ja"?((state.meterVal[p.id]||"?")+" m"):yn==="nein"?"Nein":"—";
    doc.setFont("helvetica","normal");doc.setTextColor("#1C1B1A");doc.text("• "+p.title,mx,y);
    doc.setFont("helvetica","bold");doc.text(txt,W-mx,y,{align:"right"});y+=6.2; });

  const aP=POINTS.filter(p=>p.kind==="auftrag");
  if(aP.length){ y+=2; head("Räume – nur wenn beauftragt"); doc.setFontSize(10);
    aP.forEach(p=>{ if(y>H-16){doc.addPage();y=16;} const a=state.auftrag[p.id];
      let txt=a==="ja"?("Beauftragt · "+(state.flaeche[p.id]||"?")+" m²"):a==="nein"?"Nicht beauftragt":a==="unklar"?"Mit Büro klären":"—";
      doc.setFont("helvetica","normal");doc.setTextColor("#1C1B1A");doc.text("• "+p.title,mx,y);
      doc.setFont("helvetica","bold");doc.text(txt,W-mx,y,{align:"right"});y+=6.2; }); }

  if(state.bemerkung){ y+=2; head("Notiz"); doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor("#1C1B1A");
    doc.splitTextToSize(state.bemerkung,W-2*mx).forEach(t=>{ if(y>H-16){doc.addPage();y=16;} doc.text(t,mx,y);y+=5.5; }); }

  POINTS.filter(p=>p.kind==="photo"||p.kind==="countphoto"||p.kind==="auftrag").forEach(p=>{
    const arr=state.photos[p.id]; if(!arr.length) return;
    doc.addPage();y=16; doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor("#C41E1E");
    doc.text(p.title+" ("+arr.length+")",mx,y); y+=4; doc.setDrawColor("#C41E1E");doc.setLineWidth(0.6);doc.line(mx,y,W-mx,y);y+=6;
    const cols=2,gap=6,cw=(W-2*mx-gap)/cols; let col=0,rowH=0;
    arr.forEach(p2=>{ const iw=cw, ih=p2.h&&p2.w?Math.min(cw*0.78,iw*p2.h/p2.w):cw*0.7;
      if(col===0&&y+ih>H-14){doc.addPage();y=16;} const x=mx+col*(cw+gap);
      try{doc.addImage(p2.url,"JPEG",x,y,iw,ih);}catch(e){}
      doc.setDrawColor("#e2ddd4");doc.setLineWidth(0.2);doc.rect(x,y,iw,ih);
      rowH=Math.max(rowH,ih); col++; if(col>=cols){col=0;y+=rowH+gap;rowH=0;} });
  });
  return doc;
}
function summaryText(){
  const st=POINTS.filter(p=>p.kind==="status").map(p=>`${p.title}: ${STLABEL[state.status[p.id]]}`);
  const cs=POINTS.filter(p=>(p.kind==="count"||p.kind==="countphoto")&&state.counts[p.id]>0).map(p=>`${p.title}: ${state.counts[p.id]}`);
  const ph=POINTS.filter(p=>p.kind==="photo"||p.kind==="countphoto"||p.kind==="auftrag").map(p=>`${p.title} ${state.photos[p.id].length}`);
  const au=POINTS.filter(p=>p.kind==="auftrag").map(p=>{ const a=state.auftrag[p.id]; return `${p.title}: ${a==="ja"?("beauftragt, "+(state.flaeche[p.id]||"?")+" m²"):a==="nein"?"nicht beauftragt":a==="unklar"?"mit Büro klären":"—"}`; });
  const me=POINTS.filter(p=>p.kind==="meter").map(p=>{ const yn=state.meterYN[p.id]; return `${p.title}: ${yn==="ja"?((state.meterVal[p.id]||"?")+" m"):yn==="nein"?"nein":"—"}`; });
  return [`Reinigungs-Report Tiefgarage`,`Datum: ${today()}`,`Mitarbeiter: ${state.mitarbeiter}`,
    `Tiefgarage: ${state.garage}`,`Art: ${state.art}`,`Fläche: ${state.size} m²`,
    ``,`Aufgaben:`,...st.map(x=>"- "+x),
    ``,`Zählungen: ${cs.join(", ")||"keine"}`,
    `Meter: ${me.join(", ")||"—"}`,
    ``,`Räume (nur wenn beauftragt):`,...au.map(x=>"- "+x),
    ``,`Fotos: ${ph.join(", ")}`,
    state.bemerkung?`\nNotiz: ${state.bemerkung}`:``].filter(x=>x!==undefined).join("\n");
}
function isKeySet(){ return CONFIG.web3formsKey && !/HIER-ACCESS-KEY/.test(CONFIG.web3formsKey); }
function fileName(){ const g=(state.garage||"Tiefgarage").replace(/[^\w\-]+/g,"_"); return `Report_${g}_${today().replace(/\./g,"-")}.pdf`; }

async function submit(){
  const miss=steps.findIndex(st=>!stepSatisfied(st));
  if(miss>=0){ alert("Bitte noch ausfüllen: "+(steps[miss].emoji||"")+" "+steps[miss].title); idx=miss; render(); return; }
  const btn=[...foot.querySelectorAll("button")].find(b=>b.classList.contains("primary"));
  if(!window.jspdf){ alert("Bitte Seite neu laden (Internet nötig)."); return; }
  if(btn){ btn.disabled=true; btn.innerHTML=`<span class="spin"></span>PDF wird erstellt …`; }
  let blob; try{ blob=buildPdf().output("blob"); }
  catch(e){ alert("Fehler beim PDF: "+e.message); if(btn){btn.disabled=false;btn.textContent="Senden ✉️";} return; }
  const file=new File([blob],fileName(),{type:"application/pdf"});
  if(isKeySet()){
    try{ if(btn) btn.innerHTML=`<span class="spin"></span>E-Mail wird gesendet …`;
      const fd=new FormData();
      fd.append("access_key",CONFIG.web3formsKey);
      fd.append("subject",`Reinigungs-Report – ${state.garage||"Tiefgarage"} – ${today()}`);
      fd.append("from_name",state.mitarbeiter||"BISKO");
      fd.append("message",summaryText());
      fd.append("attachment",file,fileName());
      const r=await fetch("https://api.web3forms.com/submit",{method:"POST",body:fd});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j.success) return successScreen("E-Mail an "+CONFIG.recipient+" ist raus. Danke!");
      throw new Error(j.message||("HTTP "+r.status));
    }catch(e){ return sendFallback(file,blob,"Automatisch ging nicht ("+e.message+"). Bitte per Teilen oder Herunterladen senden."); }
  }
  return sendFallback(file,blob,"");
}
async function sendFallback(file,blob,warn){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:"Reinigungs-Report",text:summaryText()+"\n\nBitte an "+CONFIG.recipient+" senden."});
      return successScreen("Geteilt. Bitte an "+CONFIG.recipient+" senden."); }catch(e){}
  }
  const url=URL.createObjectURL(blob);
  main.innerHTML=`<div class="review"><div class="emoji">📄</div><h1>Report fertig</h1>
    ${warn?`<div class="banner">${esc(warn)}</div>`:``}
    <p class="lead">PDF herunterladen und per E-Mail an ${esc(CONFIG.recipient)} schicken.</p>
    <p style="text-align:center"><a class="link" href="${url}" download="${fileName()}">⬇️ PDF herunterladen</a></p>
    <p style="text-align:center"><a class="link" href="mailto:${CONFIG.recipient}?subject=${encodeURIComponent('Reinigungs-Report '+state.garage+' '+today())}&body=${encodeURIComponent(summaryText()+'\n\n(PDF bitte anhängen)')}">✉️ E-Mail öffnen</a></p></div>`;
  foot.innerHTML=""; const n=el(`<button class="nav primary">Neuen Report starten</button>`); n.addEventListener("click",resetAll); foot.appendChild(n);
}
function successScreen(msg){
  main.innerHTML=`<div class="done"><div class="big">✓</div><h1>Fertig</h1><p class="lead">${esc(msg)}</p></div>`;
  foot.innerHTML=""; const n=el(`<button class="nav primary">Neuen Report starten</button>`); n.addEventListener("click",resetAll); foot.appendChild(n);
  $("hBar").style.width="100%";
}
function resetAll(){
  state.mitarbeiter="";state.garage="";state.art="";state.size="";state.bemerkung="";
  POINTS.forEach(p=>{ if(p.id in state.counts) state.counts[p.id]=0; if(p.id in state.photos) state.photos[p.id]=[]; if(p.id in state.status) state.status[p.id]=""; });
  idx=0; render();
}

/* ---------- Sprungliste ---------- */
function stateChip(s){
  if(s.type==="status"){ const v=state.status[s.id]; return `<span class="dot ${STCLS[v]||""}"></span>`; }
  if(s.type==="auftrag"){ const a=state.auftrag[s.id]; const c=a==="ja"?"green":a==="nein"?"red":a==="unklar"?"grey":""; return `<span class="dot ${c}"></span>`; }
  if(s.type==="meter"){ const yn=state.meterYN[s.id]; if(yn==="ja") return `<span class="s">${esc(state.meterVal[s.id]||"?")} m</span>`; return `<span class="dot ${yn==="nein"?"red":""}"></span>`; }
  if(s.type==="count") return state.counts[s.id]>0?`<span class="s">${state.counts[s.id]}</span>`:`<span class="dot"></span>`;
  if(s.type==="countphoto") return `<span class="s">${state.counts[s.id]}·${state.photos[s.id].length}📷</span>`;
  if(s.type==="photo") return state.photos[s.id].length?`<span class="s">${state.photos[s.id].length}📷</span>`:`<span class="dot"></span>`;
  const val=state[s.field]; return val?`<span class="dot set"></span>`:`<span class="dot"></span>`;
}
function openJump(){
  const list=$("jList"); list.innerHTML="";
  steps.forEach((s,i)=>{ if(s.type==="start"||s.type==="review") return;
    const it=el(`<div class="item ${i===idx?"cur":""}">${s.img?`<img class="jicon" src="${s.img}">`:`<span class="e">${s.emoji||"•"}</span>`}<span>${esc(s.title)}</span>${stateChip(s)}</div>`);
    it.addEventListener("click",()=>{ idx=i; $("jump").style.display="none"; render(); });
    list.appendChild(it);
  });
  $("jump").style.display="block";
}
$("btnList").addEventListener("click",openJump);
$("jClose").addEventListener("click",()=>$("jump").style.display="none");
$("jump").addEventListener("click",(e)=>{ if(e.target.id==="jump") $("jump").style.display="none"; });

/* ---------- Übersetzen (Google) ---------- */
let xlateLoaded=false;
window.googleTranslateElementInit=function(){
  try{ new google.translate.TranslateElement({pageLanguage:"de",autoDisplay:false},"google_translate_element");
       const m=$("xlateMsg"); if(m) m.textContent="Bitte oben die Sprache auswählen."; }catch(e){}
};
$("btnXlate").addEventListener("click",()=>{
  const box=$("xlate");
  const show=box.style.display!=="block";
  box.style.display=show?"block":"none";
  if(show&&!xlateLoaded){ xlateLoaded=true;
    $("xlateMsg").textContent="Sprache wird geladen …";
    const sc=document.createElement("script");
    sc.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
    sc.onerror=()=>{ $("xlateMsg").textContent="Übersetzen gerade nicht möglich. Bitte Internet prüfen."; };
    document.body.appendChild(sc);
    setTimeout(()=>{ if(!document.querySelector("#google_translate_element .goog-te-combo")){ $("xlateMsg").textContent="Hinweis: Übersetzen erscheint nur auf der hochgeladenen Seite (mit Internet), nicht in der Vorschau."; } },3500);
  }
});

const _lg=document.querySelector(".logo"); if(_lg) _lg.src=LOGO_MARK;
render();
</script>
